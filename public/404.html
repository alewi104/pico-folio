<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var segments = l.pathname.split("/");
      var pathAfterRepo = segments.slice(1 + pathSegmentsToKeep).join("/");

      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          segments.slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          pathAfterRepo.replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
